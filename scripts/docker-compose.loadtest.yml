# 배차의 민족 — 부하 테스트 전용 스택 (scripts/simulator.py 가 켜고 끈다)
#
#   시연용 스택(docker-compose.yml · 8000/8501)과 완전히 분리:
#     - 프로젝트 이름 baecha-load · DB/Redis 는 별도 볼륨 · 호스트에 여는 포트는 API 18000 하나 (이 PC 에서만)
#     - .env 를 읽지 않음 → 국세청 · Gemini 키가 없으니 외부 API 를 부르지 않음 (사업자 확인은 모의 판정)
#     - 프런트 · 가상 기사 시뮬레이터 없음 (부하는 scripts/simulator.py 만 넣는다)
#     - DEMO_AUTO_DELIVER=0 → 운행이 자동으로 끝나지 않아 GPS 핑을 계속 받을 수 있음
#
#   직접 다룰 때 (저장소 최상위 폴더에서)
#     켜기:  docker compose -f scripts/docker-compose.loadtest.yml up -d
#     끄기:  docker compose -f scripts/docker-compose.loadtest.yml down -v     (테스트 데이터까지 삭제)
#   이미지는 시연 스택이 빌드한 baecha-backend:dev 를 그대로 쓴다 (코드를 바꿨으면 먼저 docker compose up --build -d)
name: baecha-load

x-app-env: &app-env
  TZ: Asia/Seoul
  DATABASE_URL: postgresql+psycopg://loadtest:loadtest@db:5432/baecha_load
  REDIS_URL: redis://redis:6379/0
  DEMO_AUTO_DELIVER: "0"
  NTS_API_KEY: ""            # 외부 국세청 API 호출 안 함
  GEMINI_API_KEY: ""
  SIM_API_KEY: loadtest-sim-key

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      TZ: Asia/Seoul
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
      POSTGRES_DB: baecha_load
    volumes:
      - load_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d baecha_load"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    environment:
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    image: baecha-backend:dev
    pull_policy: never
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "127.0.0.1:18000:8000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  load_pgdata:
