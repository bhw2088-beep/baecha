[pytest]
# backend 폴더에서:  python -m pytest            (단위 + e2e(프로세스 안) + 빠른 스트레스)
#                    python -m pytest tests/unit_tests   (단위 테스트만 · 가장 빠름)
#                    python -m pytest -m "not stress"    (스트레스 제외)
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    e2e: API 전체 흐름 (기본: 프로세스 안 TestClient · E2E_API_BASE 지정 시 실행 중인 서버)
    stress: 마이크로 배치 · 대량 스트레스 (느림)
filterwarnings =
    ignore::DeprecationWarning
