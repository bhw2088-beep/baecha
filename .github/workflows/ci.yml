# 배차의 민족 CI
#  - lint-test   : 파이썬 3.12 · 3.14 에서 pyflakes 검사 + 서버 없이 도는 점검(3D 적재 · 매칭 · FSM/모의 PG ·
#                  컴플라이언스 · 운임/수급/안전율 · 추적/해시 체인/리뷰 · 마이크로 배치 스트레스)
#  - integration : docker compose 로 전체(DB · Redis · 백엔드 · Celery 워커 · 시뮬레이터)를 띄우고 API 전체 흐름 점검
#  - 폴더: backend/(src · tests) · frontend/(app) · simulator/ — 백엔드 점검은 backend 폴더에서 실행한다.
name: CI

on:
  push:
    branches: [main, master, staging]   # 브랜치 전략: docs/가이드/브랜치_전략.md
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: 문법 · 미사용 import 검사 (pyflakes)
        run: python -m pyflakes backend/src backend/tests frontend/app frontend/scripts simulator scripts
      - name: 단위 · e2e(프로세스 안) · 빠른 스트레스 테스트 (서버 없이)
        working-directory: backend
        env:
          BAECHA_DB: "0"
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: .env 준비 (CI 전용 임시 값)
        run: |
          cp .env.example .env
          sed -i "s/change-me-sim/ci-sim-key/; s/change-me/ci-db-pass/g" .env
      - name: 전체 서비스 실행
        run: docker compose up -d --build
      - name: 백엔드 준비 대기
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health
      - name: API 전체 흐름 점검 (등록 → 매칭 → 운행 → 청구 → 모의 결제 · Celery · 핑 · 리뷰 · 해시 체인)
        working-directory: backend
        env:
          E2E_API_BASE: http://localhost:8000/api/v1   # e2e 를 실행 중인 도커 스택에 HTTP 로 (Celery 비동기 적재 포함)
        run: |
          pip install pytest requests
          python -m pytest tests/e2e_tests -q
      - name: 운영용 compose 파일 문법 검사
        run: docker compose -f docker-compose.prod.yml config -q
      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --tail 200
      - name: 정리
        if: always()
        run: docker compose down -v
