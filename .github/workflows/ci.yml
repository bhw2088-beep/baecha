# 배차의 민족 CI
#  - lint-test   : 파이썬 3.12 · 3.14 에서 pyflakes 검사 + 서버 없이 도는 점검(3D 적재 · 매칭 · FSM/모의 PG)
#  - integration : docker compose 로 전체(DB · Redis · 백엔드 · Celery 워커 · 시뮬레이터)를 띄우고 API 전체 흐름 점검
# 이 프로젝트 폴더(수정본)가 저장소 최상위라고 가정한다.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 문법 · 미사용 import 검사 (pyflakes)
        run: python -m pyflakes backend frontend simulator tests tools
      - name: 점검 스크립트 (서버 없이)
        env:
          BAECHA_DB: "0"
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: .env 준비 (CI 전용 임시 값)
        run: |
          cp .env.example .env
          sed -i "s/change-me-sim/ci-sim-key/; s/change-me/ci-db-pass/g" .env
      - name: 전체 서비스 실행
        run: docker compose up -d --build
      - name: 백엔드 준비 대기
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health
      - name: API 전체 흐름 점검 (등록 → 매칭 → 운행 → 청구 → 모의 결제 · Celery)
        run: docker compose exec -T backend python tests/smoke_test.py
      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --tail 200
      - name: 정리
        if: always()
        run: docker compose down -v
