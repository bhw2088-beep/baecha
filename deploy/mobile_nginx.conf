# 차주용 휴대폰 3D 적재 가이드 전용 주소 (포트 8503 → 컨테이너 8080)
#   /        → 백엔드의 /m/ (Three.js 모바일 웹: index.html · css · js)
#   /api/... → 백엔드 API 그대로 (모바일 웹이 같은 주소의 /api/v1 을 부르므로)
# 주소 뒤에 /m/ 를 붙이지 않아도 바로 적재 가이드가 열린다.
server {
    listen 8080;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000/m/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
