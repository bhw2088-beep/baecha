# tests/concurrency_test.py 전용 덧붙임 파일 (scripts/docker-compose.loadtest.yml 위에 겹쳐 씀)
#   - 프로젝트 이름은 테스트가 baecha-conc 로 따로 줘서 부하 테스트 스택(baecha-load)과도 겹치지 않음
#   - 지금 폴더의 코드를 넣어서, 이미지를 다시 빌드하지 않아도 현재 코드로 점검
#     (인수증 사진 폴더는 테스트 볼륨으로 돌려서 폴더에 파일을 쓰지 않음 · .pyc 도 만들지 않음.
#      사진 폴더 자리(backend/data/pod_photos, .gitignore 대상)에 빈 폴더만 생길 수 있음)
#   - 호스트 포트를 열지 않음 (테스트 요청은 같은 도커 네트워크 안에서 보냄)
services:
  backend:
    ports: !override []
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ..:/app                                      # 경로 기준: 첫 compose 파일 위치(scripts/) → .. = 수정본
      - conc_pod:/app/backend/data/pod_photos        # 인수증 사진은 테스트 볼륨에

volumes:
  conc_pod:
